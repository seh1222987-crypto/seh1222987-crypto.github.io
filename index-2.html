<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b98a1">
  <title>Фоксфорд · Тренажёр ЕГЭ</title>
  <style>
    html,body{margin:0;min-height:100%;background:#25262b;color:#fff;font:16px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
    body{background:linear-gradient(180deg,#2c99a5 0,#1d4f78 200px,#25262b 520px) no-repeat,#25262b}
    .boot{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
    .mark{width:56px;height:56px;border-radius:50%;background:#ff6b00;display:grid;place-items:center;font-weight:700;font-size:32px;animation:pulse 1.2s ease-in-out infinite}
    .boot button{display:none;font:inherit;font-weight:700;color:#fff;background:#ff6b00;border:0;border-radius:999px;padding:13px 24px;cursor:pointer}
    .boot.failed button{display:inline-block}.boot.failed .mark{animation:none}
    @keyframes pulse{50%{transform:scale(.9);opacity:.75}}
    @media(prefers-reduced-motion:reduce){.mark{animation:none}}
  </style>
</head>
<body>
  <div class="boot" id="boot"><span class="mark">ƒ</span><p id="boot-text">Открываем тренажёр…</p><button type="button" onclick="location.reload()">Попробовать ещё раз</button></div>
  <script>
  /* GitHub Pages is very slow on some networks, so the full app (5.7 MB) is taken
     from a CDN copy of a fixed commit and written into this page. The page keeps
     its github.io address, so saved progress (localStorage) stays where it was.
     To publish a new version: upload the full app file, then change APP_COMMIT and APP_PATH. */
  (function(){
    var APP_REPO='seh1222987-crypto/seh1222987-crypto.github.io';
    var APP_COMMIT='81fe53f93339326b69b9bc99a4f3ec4b4dc969ea';
    var APP_PATH='index-2.html';
    var sources=[
      'https://cdn.jsdelivr.net/gh/'+APP_REPO+'@'+APP_COMMIT+'/'+APP_PATH,
      'https://fastly.jsdelivr.net/gh/'+APP_REPO+'@'+APP_COMMIT+'/'+APP_PATH,
      'https://raw.githubusercontent.com/'+APP_REPO+'/'+APP_COMMIT+'/'+APP_PATH
    ];
    var text=document.getElementById('boot-text');
    function fail(){document.getElementById('boot').className='boot failed';text.textContent='Не получилось загрузить тренажёр. Проверь интернет и попробуй ещё раз.'}
    function load(i){
      if(i>=sources.length)return fail();
      var done=false,xhr=new XMLHttpRequest(),timer;
      function stall(){clearTimeout(timer);timer=setTimeout(function(){if(!done){done=true;xhr.abort();load(i+1)}},15000)}
      stall();
      xhr.open('GET',sources[i]);
      xhr.onprogress=stall;
      xhr.onload=function(){
        if(done)return;done=true;clearTimeout(timer);
        var html=xhr.responseText||'';
        if(xhr.status!==200||html.indexOf('EMBEDDED_BANK')<0)return load(i+1);
        document.open();document.write(html);document.close();
      };
      xhr.onerror=function(){if(done)return;done=true;clearTimeout(timer);load(i+1)};
      xhr.send();
    }
    load(0);
  })();
  </script>
</body>
</html>
